<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS for Beginners</title>
    <style>

        
        body {
            background-color: #f0f8ff; 
            font-family: Arial, sans-serif; 
            margin: 20px;
        }

        h1 {
            color: navy;
            text-align: center; 
        }

    
        p {
            color: red; 
            font-size: 16px; 
            line-height: 1.5; 
            padding: 10px; 
            margin: 10px auto;
        }
        a {
            color: darkorange;
            text-decoration: none; /* Remove underline */
        }

        
        a:hover {
            color: darkgrey;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Welcome to CSS Basics</h1>
    <p>This paragraph is styled using CSS. You can change colors, fonts, borders, and more!</p>
</body>
</html>

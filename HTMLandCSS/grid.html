
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Grid Layout Example</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: 150px 150px 150px;
      grid-template-rows: 150px 150px;
      gap: 50px;
      width: 500px;
      margin: 50px auto;
      border: 2px solid #ccc;
      padding: 20px;
      background-color: #f7cac9;
    }

    .grid1, .grid2, .grid3, .grid4 {
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
      border-radius: 8px;
    }

    .grid1 {
      background-color: #ff6f61;
      grid-column: 1 / 2;
      grid-row: 1 / 2;
    }

    .grid2 {
      background-color: #6b5b95;
      grid-column: 2 / 4; /* spans 2 columns */
      grid-row: 1 / 2;
    }

    .grid3 {
      background-color: #88b04b;
      grid-column: 1 / 3; /* spans 2 columns */
      grid-row: 2 / 3;
    }

    .grid4 {
      background-color: #88b04b;
      color: black;
      grid-column: 3 / 4;
      grid-row: 2 / 3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="grid1">Box 1</div>
    <div class="grid2">Box 2</div>
    <div class="grid3">Box 3</div>
    <div class="grid4">Box 4</div>
  </div>
</body>
</html>

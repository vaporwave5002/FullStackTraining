<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
</head>
<body>

  <h2>Contact Us</h2>

  <form action="">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your Full Name" required><br><br>

    <label for="mail">Email:</label><br>
    <input type="email" id="mail" name="mail" placeholder="abc@gmail.com" required><br><br>

    <label for="phone">Phone Number:</label><br>
    <input type="tel" id="phone" name="phone" placeholder="+91" required><br><br>

    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" name="dob" required><br><br>

    <label for="message">Message:</label><br>
    <textarea id="message" name="message" placeholder="Enter your message" rows="4" required></textarea><br><br>

    <button type="submit">Send Message</button>
  </form>

</body>
</html>

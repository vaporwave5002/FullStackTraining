
<!DOCTYPE html>
<html>
<head>
    <title>Meal Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fafafa;
        }
        h1 {
            color: #333;
        }
        #menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .meal-card {
            width: 200px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .meal-card:hover {
            transform: scale(1.05);
        }
        .meal-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .meal-card h3 {
            font-size: 16px;
            padding: 10px;
            margin: 0;
            color: #555;
        }
        #loadBtn {
            margin-top: 20px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #loadBtn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1> WELCOME TO MY MENU </h1>
    <button id="loadBtn">Load Random Meals</button>
    <div id="menu"></div>

    <script>
        async function displayMeals() {
            // We'll call the "random selection" API multiple times to get different meals
            const menuDiv = document.getElementById('menu');
            menuDiv.innerHTML = "<p>Loading...</p>";
            let meals = [];

            for (let i = 0; i < 6; i++) {  // fetch 6 random meals
                const response = await fetch("https://www.themealdb.com/api/json/v1/1/random.php");
                const data = await response.json();
                if (data.meals && data.meals.length > 0) {
                    meals.push(data.meals[0]);
                }
            }

            // Generate HTML for meals
            let html = "";
            meals.forEach(meal => {
                html += `
                    <div class="meal-card">
                        <img src="${meal.strMealThumb}" alt="${meal.strMeal}">
                        <h3>${meal.strMeal}</h3>
                    </div>
                `;
            });

            menuDiv.innerHTML = html;
        }

        // Load meals when button is clicked
        document.getElementById('loadBtn').addEventListener('click', displayMeals);
    </script>
</body>
</html>

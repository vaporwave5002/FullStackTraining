<!DOCTYPE html>
<html lang="en">
<head>
    <title> DOCUMENT </title>
    <style>

  .container > div {
    width: 150px;
    height: 150px;
    border-radius: 8px;
  }

  .box1 {
    background-color: #ff6f61; 
    position: absolute;
  }

  .box2 {
    background-color: #6b5b95; 
    position: relative;
  }
  .box3 {
    background-color: #88b04b; 
  }
  .box4 {
    background-color: #6b5b95; 
  }
</style>
</head>
<body>
   <div class="container">
    <div class="box1">hello</div>
    <div class="box2">guten morgan</div>
    <div class="box3">bye</div>
    <div class="box4">viggo</div>
   </div>
</body>
</html>

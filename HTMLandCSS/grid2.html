
<!DOCTYPE html> 
<html lang="en">
<head>
  <title>Grid Layout </title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* Example: 2 columns */
      gap: 10px; /* Space between grid items */
      padding: 10px;
      border: 2px solid #333;
    }
    .grid-container > div {
      background-color: #ccc;
      padding: 20px;
      text-align: center;
      border: 1px solid #999;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid1">Box 1</div>
    <div class="grid2">Box 2</div>
    <div class="grid3">Box 3</div>
    <div class="grid4">Box 4</div>
  </div>
</body>
</html>

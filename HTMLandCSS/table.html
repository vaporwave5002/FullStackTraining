<!DOCTYPE html>
<html>
<head>
  <title>Simple HTML Table</title>
  <link ref = "ipec.css"
</head>
<body>
  <h1>Table</h1>
  <table>
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>Country</th>
    </tr>
    <tr>
      <td>Alice</td>
      <td>25</td>
      <td>USA</td>
    </tr>
    <tr>
      <td>Bob</td>
      <td>30</td>
      <td>Canada</td>
    </tr>
    <tr>
      <td>Charlie</td>
      <td>22</td>
      <td>UK</td>
    </tr>
  </table>

  
</body>
</html>
